{% extends "base.html" %}
{% from "_macros.html" import page_header %}

{% block title %}Passwort ändern{% endblock %}

{% block content %}
{{ page_header("Passwort ändern", current_user.email, url_for('main.settings')) }}

<form class="form-panel" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="row g-3">
    <div class="col-12">
      <label class="form-label" for="current_password">Aktuelles Passwort</label>
      <input class="form-control" id="current_password" name="current_password" type="password" autocomplete="current-password" required autofocus>
    </div>

    <div class="col-12">
      <label class="form-label" for="password">Neues Passwort</label>
      <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
    </div>

    <div class="col-12">
      <label class="form-label" for="password_confirm">Neues Passwort wiederholen</label>
      <input class="form-control" id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" minlength="8" required>
    </div>
  </div>

  <div class="d-flex gap-2 mt-4">
    <button class="btn btn-primary" type="submit">Speichern</button>
  </div>
</form>
{% endblock %}
