{% extends "base.html" %}
{% from "_macros.html" import help_button, help_drawer %}

{% block content %}
{{ help_drawer("konto") }}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h2 class="card-title text-center mb-4">Registrieren</h2>
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label for="username" class="form-label">Benutzername</label>
                            <input type="text" class="form-control" id="username" name="username" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Passwort (mind. 8 Zeichen)</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <div class="mb-3">
                            <label for="password_confirm" class="form-label">Passwort wiederholen</label>
                            <input type="password" class="form-control" id="password_confirm" name="password_confirm" required>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="consent" name="consent" required>
                            <label class="form-check-label" for="consent">
                                Ich habe die <a href="{{ url_for('main.privacy') }}" target="_blank" rel="noopener">Datenschutzhinweise</a> gelesen und bin einverstanden.
                            </label>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Registrieren</button>
                    </form>
                    <div class="text-center mt-3">
                        <p>Du hast bereits ein Konto? <a href="{{ url_for('auth.login') }}">Hier anmelden</a></p>
                    </div>
                </div>
            </div>
            <div class="auth-help">{{ help_button("konto") }}</div>
        </div>
    </div>
</div>
{% endblock %}
