name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Lint & Tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyflakes
      - name: pyflakes
        run: python -m pyflakes app run.py tests
      - name: Unit-Tests
        run: python -m unittest discover -s tests -t . -v

  docker:
    name: Docker-Image (Tests im Build + Healthcheck)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Test-Stage bauen
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: false
          load: true
          tags: motodb:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Runtime-Image bauen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: motodb:ci
          cache-from: type=gha
      - name: Container startet als Nicht-Root und wird healthy
        run: |
          docker run -d --name motodb -e SECRET_KEY=ci-secret-key-0123456789 motodb:ci
          echo "Prozess-Benutzer: $(docker exec motodb id -un)"
          test "$(docker exec motodb id -u)" = "1000"
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' motodb)
            echo "health: $status"
            [ "$status" = "healthy" ] && exit 0
            [ "$status" = "unhealthy" ] && { docker logs motodb; exit 1; }
            sleep 2
          done
          docker logs motodb
          exit 1
